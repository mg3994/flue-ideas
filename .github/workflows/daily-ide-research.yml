name: "IDE Guide: Daily 3:00 AM IST Research Cron"

on:
  schedule:
    # Target: 3:00 AM IST daily (21:30 UTC).
    # Note: GitHub Actions scheduled workflows may experience slight execution delays (typically 5 to 15 mins) depending on runner VM queue load.
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Post report as a GitHub Issue'
        required: false
        type: boolean
        default: true
      force_run:
        description: 'Flexible manual trigger run (overrides schedule delay)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  research-and-synthesize:
    name: "Automated IDE Web Research & Intelligence"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Skills & Base Content
        run: npm test

      - name: Execute Daily IDE Web Research Cron
        run: node scripts/cron-research-ides.mjs

      - name: Upload Daily Intelligence Assets
        uses: actions/upload-artifact@v4
        with:
          name: daily-ide-intelligence-pack
          path: |
            dist/DAILY_IDE_REPORT.md
            dist/releases/daily-trending/*
          retention-days: 14

      - name: Publish Daily Intelligence to GitHub Issues
        if: github.event_name == 'schedule' || github.event.inputs.create_issue == 'true' || github.event.inputs.create_issue == true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.resolve('dist/DAILY_IDE_REPORT.md');
            
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf-8');
              const today = new Date().toISOString().split('T')[0];
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📅 Daily IDE Intelligence & Content Pack — ${today} (3:00 AM IST)`,
                body: body,
                labels: ['daily-research', 'content-synthesis', 'ide-guide']
              });
              console.log('✅ Daily GitHub Issue created successfully.');
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
